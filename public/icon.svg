<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Matchday, the fixture: two halves facing each other across a gap. Home and away, or a ball about
       to be kicked off. Red and ink are Matchday's own colours. -->
  <defs><clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath></defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#fff"/>
    <path fill="#d6001c" d="M236 96a160 160 0 0 0 0 320z"/>
    <path fill="#111" d="M276 96a160 160 0 0 1 0 320z"/>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="6"/>
</svg>
