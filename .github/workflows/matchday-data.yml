name: Matchday data

# Adds newly finished Premier League matches to the matchup data (xG by role, team ratings,
# player match logs) and the clubs' chances, refits the Net xG weights, relearns the projections from
# every gameweek played (scripts/sport/fit-fpl.mjs), saves and grades the weekly projections, and
# commits it, which redeploys the site. Mondays catch the weekend round, Thursdays the midweek one,
# Fridays save the weekend's projections before the deadline. A run takes about a minute.
# GitHub starts scheduled runs hours late, so the site doesn't wait for this to grade a gameweek:
# /api/sport/fpl/record grades it from the saved projections as soon as its last match is over.
on:
  schedule:
    - cron: '23 5 * * 1'
    # Tuesday morning: a gameweek that ends on Monday night is committed the next day, not on Thursday.
    - cron: '23 5 * * 2'
    - cron: '23 5 * * 4'
    # Friday morning, before the weekend deadline: save the gameweek's projections with the latest news.
    - cron: '23 8 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matchday-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The script uses only Node's built-ins and the app's own modules, so no npm install.
      - run: node scripts/sport/build-matchups.mjs
      # Every club's chances at both ends in Opta's numbers: xG from FPL's players, big chances from the
      # Premier League's match stats. Either can turn cloud machines away; the chart then waits a run.
      - run: node scripts/sport/build-chances.mjs || echo "FPL or the Premier League unavailable; chances not updated this run"
      # Relearn the Net xG weights with the new matches and re-test them (a few seconds).
      - run: node scripts/sport/fit-netxg.mjs
      # This season's gameweeks so far, for the projections to learn from. FPL can turn cloud machines
      # away; the fit then learns from the copy the last run saved.
      - run: node scripts/sport/build-fpl-history.mjs || echo "FPL unavailable; this season's history not updated this run"
      # Relearn who starts and how defensive contributions bunch from every gameweek so far, checked on
      # this season's latest weeks before the projections use it (a few seconds). If it fails, last
      # run's model stays and the snapshot below still runs.
      - run: node scripts/sport/fit-fpl.mjs || echo "Fit failed; the projections keep last run's model"
      # Save this gameweek's projections before the deadline, and grade the gameweeks played.
      # FPL sometimes turns cloud machines away; the record then waits for the next run.
      - run: node scripts/sport/accuracy.mjs || echo "FPL unavailable; track record not updated this run"
      - name: Commit if anything changed
        run: |
          git add data/sport public/sport/data
          if git diff --cached --quiet; then
            echo "No new matches."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Matchday data: add finished Premier League matches"
          git push
